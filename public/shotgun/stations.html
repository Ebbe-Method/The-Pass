<!doctype html>
<html lang="en">
  <head>

    <title>The Pass — stations</title>

    </style>
  </head>
  <body>
    <p style="letter-spacing:.3em;padding:24px 24px 0;color:#ffb347">THE PASS · STATIONS</p>
    <div class="lanes">
      <div class="lane"><h2>You</h2><div class="ticket hot">#3064 · 25m quiet</div></div>
      <div class="lane"><h2>Cursor</h2><div class="ticket">#3840 · 11m</div></div>
      <div class="lane"><h2>Claude</h2><div class="ticket">#2711 · 1h</div></div>
      <div class="lane"><h2>Unknown</h2><div class="ticket hot">#1321 stale</div></div>
    </div>
  </body>
</html>
