<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The Pass — two pits</title>
    <style>
      html,body{margin:0;background:#100e0c;color:#f3ead7;font-family:Sora,sans-serif}
      .grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:24px}
      .pit{background:#1c1814;padding:20px;min-height:70vh;border:1px solid #3d362e}
      .ticket{background:#f3ead7;color:#1c140c;padding:16px;margin-bottom:12px}
      .hot{outline:2px solid #ff5a1f}
      h2{font-weight:500;letter-spacing:.2em;font-size:12px;text-transform:uppercase;color:#ffb347}
    </style>
  </head>
  <body>
    <p style="letter-spacing:.3em;padding:24px 24px 0;color:#ffb347">THE PASS · PITS</p>
    <div class="grid">
      <section class="pit">
        <h2>Waiting</h2>
        <div class="ticket hot">#3064 waiting on you · 25m</div>
        <div class="ticket hot">#1321 stale · 2h</div>
      </section>
      <section class="pit">
        <h2>Cooking</h2>
        <div class="ticket">#3840 Cursor · 11m</div>
        <div class="ticket">#2711 Claude · 1h</div>
      </section>
    </div>
  </body>
</html>
